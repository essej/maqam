name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: maqam-live
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin: maqam-live
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            bin: maqam-live
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: maqam-live.exe
            archive_ext: zip

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          archive="maqam-live-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          tar -C dist -czf "${archive}.${{ matrix.archive_ext }}" "${{ matrix.bin }}"
          shasum -a 256 "${archive}.${{ matrix.archive_ext }}" > "${archive}.${{ matrix.archive_ext }}.sha256"

      - name: Package release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = "maqam-live-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "$archive.${{ matrix.archive_ext }}" -Force
          $hash = (Get-FileHash "$archive.${{ matrix.archive_ext }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive.${{ matrix.archive_ext }}" | Set-Content -Encoding ascii "$archive.${{ matrix.archive_ext }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: maqam-live-${{ matrix.target }}
          path: |
            *.${{ matrix.archive_ext }}
            *.${{ matrix.archive_ext }}.sha256

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*
            *.mq
